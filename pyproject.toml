[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length handled by black/formatter
    "B008",  # FastAPI Depends in function parameter defaults
    "E402",  # module level import order for sys.path bootstrap in tests
    "F841",  # local variable assigned but never used
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-v --tb=short"

name: SentinelX CI Pipeline

on:
  push:
    branches: [main, "phase-**"]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    name: Lint, Test & Quality Assurance
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentinelx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint codebase with Ruff
        run: |
          ruff check .

      - name: Run database migrations (Alembic)
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/sentinelx_test
          PYTHONPATH: .:backend
        run: |
          alembic upgrade head

      - name: Run Pytest test suite with Coverage
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/sentinelx_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          JWT_SECRET_KEY: test-secret-key-that-is-at-least-32-chars-long!
          DEBUG: "True"
          PYTHONPATH: .:backend
        run: |
          pytest backend/tests/ -v -m "not integration" --cov=backend/app --cov-report=term-missing --cov-fail-under=80
